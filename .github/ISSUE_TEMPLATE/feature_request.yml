name: Feature request
description: Suggest an idea or new provider for Varchy
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: We welcome new provider adapters, project templates, and agent instruction targets!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
